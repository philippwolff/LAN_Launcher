name: Windows Client ZIP

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to publish (e.g. v1.0.1); leave empty for test build'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'src/LanLauncher.Client/**'
      - 'src/LanLauncher.Shared/**'
      - '.github/workflows/windows-client.yml'

permissions:
  contents: write

jobs:
  build-client:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows x64 client
        shell: pwsh
        run: >
          dotnet publish src/LanLauncher.Client/LanLauncher.Client.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:PublishReadyToRun=false
          --output publish/client

      - name: Embed build identity
        shell: pwsh
        run: |
          Set-Content -Path "publish/client/launcher-build.txt" -Value "${{ github.run_id }}" -NoNewline -Encoding ascii
          $version = if ('${{ inputs.release_tag }}' -match '^v[0-9]+\\.[0-9]+\\.[0-9]+

      - name: Package ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'publish/client/*' -DestinationPath 'LAN_Party_Client-win-x64.zip' -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LAN_Party_Client-win-x64
          path: LAN_Party_Client-win-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload ZIP to existing GitHub Release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Release tag must look like v1.0.1' }
          gh release view "$env:RELEASE_TAG" --repo "${{ github.repository }}" | Out-Null
          gh release upload "$env:RELEASE_TAG" "LAN_Party_Client-win-x64.zip" --repo "${{ github.repository }}" --clobber
